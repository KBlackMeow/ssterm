[package]
name = "ssterm_pty_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libc = "0.2"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "consoleapi",
  "errhandlingapi",
  "fileapi",
  "handleapi",
  "ioapiset",
  "libloaderapi",
  "minwinbase",
  "namedpipeapi",
  "processthreadsapi",
  "synchapi",
  "winbase",
  "wincon",
  "wincontypes",
  "winerror",
  "winnt",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
